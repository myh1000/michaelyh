<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Secret</title>
	<link rel="shortcut icon" href="https://www.michaelyh.com/favicon.ico?">
	<link rel="icon" href="https://www.michaelyh.com/favicon.ico?">
	<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
	<style>
*, *::before, *::after {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Nunito", sans-serif;
	min-height: 100vh;
	background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #f48fb1 60%, #fce4ec 100%);
	background-size: 400% 400%;
	animation: gradientShift 8s ease infinite;
	overflow-x: hidden;
	position: relative;
}

@keyframes gradientShift {
	0% { background-position: 0% 50%; }
	50% { background-position: 100% 50%; }
	100% { background-position: 0% 50%; }
}

/* Floating hearts background */
.hearts-bg {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
	z-index: 0;
	overflow: hidden;
}

.heart {
	position: absolute;
	bottom: -50px;
	font-size: 1.5rem;
	animation: floatUp linear infinite;
	opacity: 0.6;
}

@keyframes floatUp {
	0% {
		transform: translateY(0) rotate(0deg) scale(1);
		opacity: 0.6;
	}
	50% {
		opacity: 0.8;
	}
	100% {
		transform: translateY(-110vh) rotate(360deg) scale(0.5);
		opacity: 0;
	}
}

/* Container */
.container {
	position: relative;
	z-index: 1;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	min-height: 100vh;
	padding: 2rem;
	gap: 1.5rem;
}

/* Title */
h1 {
	font-size: 2.2rem;
	font-weight: 800;
	color: #ad1457;
	text-align: center;
	text-shadow: 0 2px 10px rgba(173, 20, 87, 0.15);
	animation: fadeSlideUp 0.8s ease-out both;
}

@keyframes fadeSlideUp {
	from {
		opacity: 0;
		transform: translateY(30px);
	}
	to {
		opacity: 1;
		transform: translateY(0);
	}
}

/* Image */
.image {
	width: 200px;
	height: 200px;
	object-fit: contain;
	border-radius: 20px;
	transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
	            height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
	animation: fadeSlideUp 0.8s ease-out 0.2s both;
	filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.1));
}

/* Shake animation for No clicks */
@keyframes shake {
	0%, 100% { transform: translateX(0); }
	10% { transform: translateX(-8px) rotate(-2deg); }
	20% { transform: translateX(8px) rotate(2deg); }
	30% { transform: translateX(-6px) rotate(-1deg); }
	40% { transform: translateX(6px) rotate(1deg); }
	50% { transform: translateX(-4px); }
	60% { transform: translateX(4px); }
	70% { transform: translateX(-2px); }
	80% { transform: translateX(2px); }
}

.shake {
	animation: shake 0.5s ease-in-out;
}

/* Buttons */
.buttons {
	display: flex;
	gap: 1.5rem;
	animation: fadeSlideUp 0.8s ease-out 0.4s both;
}

.button {
	padding: 0.75rem 2rem;
	min-width: 130px;
	font-family: "Nunito", sans-serif;
	font-size: 1.1rem;
	font-weight: 700;
	cursor: pointer;
	border: none;
	border-radius: 50px;
	transition: transform 0.2s ease, box-shadow 0.2s ease;
	position: relative;
	overflow: hidden;
}

.button::after {
	content: '';
	position: absolute;
	top: 50%;
	left: 50%;
	width: 0;
	height: 0;
	background: rgba(255, 255, 255, 0.3);
	border-radius: 50%;
	transform: translate(-50%, -50%);
	transition: width 0.4s ease, height 0.4s ease;
}

.button:hover::after {
	width: 200px;
	height: 200px;
}

.button:hover {
	transform: scale(1.08);
}

.button:active {
	transform: scale(0.95);
}

#button1 {
	background: linear-gradient(135deg, #e0e0e0, #bdbdbd);
	color: #555;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

#button1:hover {
	box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
}

#button2 {
	background: linear-gradient(135deg, #f06292, #e91e63);
	color: white;
	box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
}

#button2:hover {
	box-shadow: 0 6px 25px rgba(233, 30, 99, 0.5);
}

/* Pulse animation for celebration text */
@keyframes pulse {
	0%, 100% { transform: scale(1); }
	50% { transform: scale(1.05); }
}

.pulse {
	animation: pulse 1.5s ease-in-out infinite;
}

/* Confetti */
.confetti-piece {
	position: fixed;
	width: 10px;
	height: 10px;
	top: -10px;
	z-index: 100;
	animation: confettiFall linear forwards;
}

@keyframes confettiFall {
	0% {
		transform: translateY(0) rotate(0deg);
		opacity: 1;
	}
	100% {
		transform: translateY(110vh) rotate(720deg);
		opacity: 0;
	}
}

/* Responsive */
@media (max-width: 600px) {
	h1 {
		font-size: 1.5rem;
	}
	.image {
		width: 150px;
		height: 150px;
	}
	.button {
		padding: 0.6rem 1.5rem;
		min-width: 110px;
		font-size: 1rem;
	}
}
	</style>
</head>
<body>
	<!-- Floating hearts background -->
	<div class="hearts-bg" id="heartsBg"></div>

	<div class="container">
		<h1 id="question">Will you be my Valentine? 🥺</h1>
		<img src="https://media1.tenor.com/m/HH2kMwrD7l0AAAAC/chiikawa-happy.gif" alt="Chiikawa" class="image" id="image">
		<div class="buttons" id="buttonsContainer">
			<button class="button" id="button1">No...</button>
			<button class="button" id="button2">Yes! Yes!</button>
		</div>
	</div>

	<script>
		// --- Floating Hearts ---
		const heartsBg = document.getElementById('heartsBg');
		const heartEmojis = ['💕', '💗', '💖', '💝', '🩷', '♥️', '✨'];
		const usagiSrc = 'https://media.tenor.com/_vwAWnWbAwkAAAAi/chiikawa-usagi.gif';
		let useUsagi = true;

		// Preload usagi image
		const usagiPreload = new Image();
		usagiPreload.src = usagiSrc;

		function createHeart() {
			const isUsagi = useUsagi && Math.random() < 0.25;
			let heart;
			if (isUsagi) {
				heart = document.createElement('img');
				heart.src = usagiSrc;
				heart.classList.add('heart');
				const size = (Math.random() * 20 + 25) + 'px';
				heart.style.width = size;
				heart.style.height = size;
			} else {
				heart = document.createElement('span');
				heart.classList.add('heart');
				heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
				heart.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
			}
			heart.style.left = Math.random() * 100 + '%';
			heart.style.animationDuration = (Math.random() * 6 + 6) + 's';
			heart.style.animationDelay = (Math.random() * 2) + 's';
			heartsBg.appendChild(heart);

			setTimeout(() => heart.remove(), 14000);
		}

		// Create initial batch
		for (let i = 0; i < 15; i++) {
			setTimeout(createHeart, i * 240);
		}
		// Keep creating hearts
		setInterval(createHeart, 640);

		// --- Main Logic ---
		const button1 = document.getElementById('button1');
		const button2 = document.getElementById('button2');
		const image = document.getElementById('image');
		const question = document.getElementById('question');
		const buttonsContainer = document.getElementById('buttonsContainer');

		let currentWidth = 200;
		let currentHeight = 200;
		let switched = false;

		const imageList = [
			"https://media1.tenor.com/m/q_GHYLfc3_IAAAAC/chiikawa-cry.gif",
			"https://media1.tenor.com/m/paXagpA4jBgAAAAd/chiikawa-sad.gif",
			"https://media1.tenor.com/m/LkB2-swGTx8AAAAC/chiikawa-crying.gif",
			"https://media1.tenor.com/m/Pargmk746akAAAAC/chiikawa-crying.gif",
			"https://media1.tenor.com/m/t81QT9rl9vgAAAAC/chiikawa-scared.gif",
		];

		const phrasesList = [
			"Don't want? 🥺",
			"Really don't want? 🥺",
			"You're gonna do me like that? 😢",
			"Pretty please? 😔",
			"Don't make me cry! 😭",
		];

		const finalImage = new Image();
		finalImage.src = "https://media1.tenor.com/m/cdZVJ_Pr19UAAAAd/usagi-chiikawa.gif";

		// Preload all images
		const preloadedImages = imageList.map(src => {
			const img = new Image();
			img.src = src;
			return img;
		});

		let currentImageIndex = -1;

		button1.addEventListener('click', function() {
			if (switched) return;

			currentWidth += 50;
			currentHeight += 50;
			currentImageIndex = (currentImageIndex + 1) % preloadedImages.length;

			image.style.width = currentWidth + 'px';
			image.style.height = currentHeight + 'px';
			image.src = preloadedImages[currentImageIndex].src;
			question.textContent = phrasesList[currentImageIndex];

			// Shake animation
			image.classList.remove('shake');
			void image.offsetWidth; // trigger reflow to restart animation
			image.classList.add('shake');
		});

		button2.addEventListener('click', function() {
			if (switched) return;
			switched = true;

			image.src = finalImage.src;
			image.style.width = '280px';
			image.style.height = '280px';
			question.textContent = "Yay! I knew you would say yes!! 😍🥰💕";
			question.classList.add('pulse');

			// Hide No button
			button1.style.display = 'none';
			button2.textContent = '💕💕💕';
			button2.style.cursor = 'default';

			// Confetti burst
			launchConfetti();
		});

		// --- Confetti ---
		function launchConfetti() {
			const colors = ['#e91e63', '#f06292', '#f48fb1', '#ff80ab', '#ff4081', '#ffd54f', '#fff176', '#ba68c8', '#7e57c2'];
			const shapes = ['circle', 'square'];

			for (let i = 0; i < 80; i++) {
				setTimeout(() => {
					const piece = document.createElement('div');
					piece.classList.add('confetti-piece');
					const color = colors[Math.floor(Math.random() * colors.length)];
					const shape = shapes[Math.floor(Math.random() * shapes.length)];
					piece.style.backgroundColor = color;
					piece.style.left = Math.random() * 100 + 'vw';
					piece.style.width = (Math.random() * 8 + 6) + 'px';
					piece.style.height = (Math.random() * 8 + 6) + 'px';
					piece.style.borderRadius = shape === 'circle' ? '50%' : '2px';
					piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
					piece.style.animationDelay = '0s';
					document.body.appendChild(piece);

					setTimeout(() => piece.remove(), 4500);
				}, i * 30);
			}
		}
	</script>
</body>
</html>
